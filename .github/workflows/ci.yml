name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cpp:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, cxx: g++, sanitize: 'OFF' }
          - { os: ubuntu-latest, cxx: clang++, sanitize: 'ON' }
          - { os: windows-latest, cxx: '', sanitize: 'OFF' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOB_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Benchmark
        if: matrix.sanitize == 'OFF'
        shell: bash
        run: |
          BIN=build/ob_bench; [ -f build/Release/ob_bench.exe ] && BIN=build/Release/ob_bench.exe
          $BIN 2000000

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test
        working-directory: web
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: web

  deploy:
    needs: [cpp, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
